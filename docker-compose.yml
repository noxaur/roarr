# roarr — one container, one port, one volume.
#
#   docker compose up -d                       # start
#   docker compose pull && docker compose up -d   # update
#
# Put roarr on the same Docker network as your *arr stack so it can reach
# them by container name (or use LAN IPs). Only Prowlarr is required: Sonarr
# and Radarr are discovered from Prowlarr's app links when left out.
services:
  roarr:
    image: ghcr.io/noxaur/roarr:latest
    container_name: roarr
    restart: unless-stopped
    ports:
      - "3847:3847"
    volumes:
      - roarr-config:/config
      # The AV1 converter (TRANSCODE) needs the media folders at the same
      # paths as in Sonarr/Radarr, and write access to them. Without these
      # mounts every conversion fails with "cannot read file".
      # - /srv/media/tv:/tv
      # - /srv/media/movies:/movies
    # Run as the uid/gid that owns the media (the PUID/PGID of your *arr
    # containers), so converted files can replace the originals.
    # user: "1000:1000"
    # Lets roarr reach apps published on the host's ports. URLs that say
    # localhost / 127.0.0.1 (typed here, or stored in Prowlarr/Sonarr) are
    # retried on the host automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: change-me
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: change-me
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: change-me
      # Optional: fast search with posters + the request inbox.
      SEERR_URL: http://seerr:5055
      SEERR_API_KEY: change-me
      # Optional: sign in with Jellyfin accounts, refresh Jellyfin right after imports.
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: change-me
      # Optional: watch-first packs. Host/user are read from Sonarr if unset.
      QBIT_URL: http://qbittorrent:8080
      QBIT_USERNAME: admin
      QBIT_PASSWORD: change-me
      # Experimental: roarr downloads and imports by itself, without
      # Sonarr/Radarr (see README → Native import). Mount the folder that
      # holds downloads and library (e.g. - /srv/data:/data) so hardlinks work.
      # IMPORT_MODE: native
      # TV_ROOT: /data/media/tv
      # MOVIES_ROOT: /data/media/movies
      # IMPORT_TRANSFER: hardlink       # hardlink | copy | move
      # QBIT_PATH_MAP: /downloads=/data/torrents   # qBittorrent path=roarr path
      # QBIT_CATEGORY: roarr
      # Grab releases Sonarr/Radarr decline anyway, still through them
      # (quality profile, custom formats, release profiles, blocklist, ...).
      # BYPASS_ARR_QUALITY: "true"
      # jellyfin (default when JELLYFIN_URL is set) | password | none
      # AUTH_MODE: jellyfin
      # AUTH_PASSWORD: something-long
      TZ: Etc/UTC
    # Optional: let Watchtower keep roarr up to date.
    # labels:
    #   - com.centurylinklabs.watchtower.enable=true

volumes:
  roarr-config:
